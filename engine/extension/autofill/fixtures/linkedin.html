<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LinkedIn Easy Apply Test Fixture</title>
</head>
<body>
  <div class="jobs-easy-apply-modal">
    <div class="jobs-easy-apply-content">
      <label for="urn:li:fsd_formElement:firstName">First Name</label>
      <input type="text" id="urn:li:fsd_formElement:firstName" name="firstName" required>

      <label for="urn:li:fsd_formElement:lastName">Last Name</label>
      <input type="text" id="urn:li:fsd_formElement:lastName" name="lastName" required>

      <label for="urn:li:fsd_formElement:email">Email Address</label>
      <input type="email" id="urn:li:fsd_formElement:email" name="email" required>

      <label for="urn:li:fsd_formElement:phoneNumber-nationalNumber">Phone number</label>
      <input type="tel" id="urn:li:fsd_formElement:phoneNumber-nationalNumber" name="phoneNumber">

      <label for="urn:li:fsd_formElement:city">City</label>
      <input type="text" id="urn:li:fsd_formElement:city" name="city">

      <label for="urn:li:fsd_formElement:resume">Upload resume</label>
      <input type="file" id="urn:li:fsd_formElement:resume" name="resume">
    </div>
  </div>
</body>
</html>
