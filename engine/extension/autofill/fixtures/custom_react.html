<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom React Form Test Fixture</title>
</head>
<body>
  <div id="root">
    <div class="css-form-container">
      <div class="form-group">
        <label for="first-name-input">First Name</label>
        <input id="first-name-input" type="text" value="">
      </div>
      <div class="form-group">
        <label for="last-name-input">Last Name</label>
        <input id="last-name-input" type="text" value="">
      </div>
      <div class="form-group">
        <label for="email-input">Email</label>
        <input id="email-input" type="email" value="">
      </div>
      <div class="form-group">
        <label for="phone-input">Phone</label>
        <input id="phone-input" type="tel" value="">
      </div>
      <div class="form-group">
        <label for="github-input">GitHub Profile</label>
        <input id="github-input" type="text" value="">
      </div>
    </div>
  </div>
</body>
</html>
