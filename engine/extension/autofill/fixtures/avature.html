<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Avature Test Fixture</title>
</head>
<body>
  <div class="avature-form">
    <div class="form-row">
      <label for="cand_firstName">First Name</label>
      <input type="text" id="cand_firstName" name="cand_firstName" required>
    </div>
    <div class="form-row">
      <label for="cand_lastName">Last Name</label>
      <input type="text" id="cand_lastName" name="cand_lastName" required>
    </div>
    <div class="form-row">
      <label for="cand_email">Email</label>
      <input type="email" id="cand_email" name="cand_email" required>
    </div>
    <div class="form-row">
      <label for="cand_phone">Phone</label>
      <input type="tel" id="cand_phone" name="cand_phone">
    </div>
    <div class="form-row">
      <label for="cand_resume">Upload Resume</label>
      <input type="file" id="cand_resume" name="cand_resume">
    </div>
  </div>
</body>
</html>
