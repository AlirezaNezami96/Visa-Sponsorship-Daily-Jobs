<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ADP Test Fixture</title>
</head>
<body>
  <div class="adp-career-center">
    <input type="text" id="adp_FirstName" name="firstName" placeholder="First Name" required>
    <input type="text" id="adp_LastName" name="lastName" placeholder="Last Name" required>
    <input type="email" id="adp_Email" name="email" placeholder="Email" required>
    <input type="tel" id="adp_Phone" name="phone" placeholder="Phone">
    <input type="text" id="adp_PostalCode" name="postalCode" placeholder="Postal Code">
    <input type="file" id="adp_Resume" name="resume">
  </div>
</body>
</html>
