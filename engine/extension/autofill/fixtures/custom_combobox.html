<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom Combobox Form Test Fixture</title>
</head>
<body>
  <div class="form-item">
    <label id="country-label">Select Country of Residence</label>
    <div role="combobox" aria-labelledby="country-label" aria-expanded="false" tabindex="0" class="css-combobox">
      <span class="combobox-placeholder">Choose a country</span>
    </div>
    <ul role="listbox" id="country-listbox" style="display: none;">
      <li role="option" data-value="US">United States</li>
      <li role="option" data-value="TR">Turkey (Türkiye)</li>
      <li role="option" data-value="DE">Germany</li>
      <li role="option" data-value="GB">United Kingdom</li>
    </ul>
  </div>
</body>
</html>
