<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Indeed Apply Test Fixture</title>
</head>
<body>
  <div id="ia-container" class="ia-JobApplication">
    <label for="input-applicant.name">Your name</label>
    <input type="text" id="input-applicant.name" name="applicant.name" required>

    <label for="input-applicant.email">Email</label>
    <input type="email" id="input-applicant.email" name="applicant.email" required>

    <label for="input-applicant.phoneNumber">Phone number</label>
    <input type="tel" id="input-applicant.phoneNumber" name="applicant.phoneNumber">

    <label for="input-applicant.location">City, State, or Zip Code</label>
    <input type="text" id="input-applicant.location" name="applicant.location">

    <label for="ia-resume-file">Resume</label>
    <input type="file" id="ia-resume-file" name="resume">
  </div>
</body>
</html>
