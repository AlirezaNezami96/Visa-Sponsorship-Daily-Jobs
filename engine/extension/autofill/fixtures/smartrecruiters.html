<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmartRecruiters Test Fixture</title>
</head>
<body>
  <div class="job-sections">
    <st-apply>
      <input type="text" id="first-name-input" name="firstName" data-qa="first-name" placeholder="First Name" required>
      <input type="text" id="last-name-input" name="lastName" data-qa="last-name" placeholder="Last Name" required>
      <input type="email" id="email-input" name="email" data-qa="email" placeholder="Email" required>
      <input type="tel" id="phone-number-input" name="phoneNumber" data-qa="phone-number" placeholder="Phone Number">
      <input type="text" id="location-input" name="city" data-qa="city" placeholder="City">
      <input type="file" data-qa="resume-upload" name="resume">
    </st-apply>
  </div>
</body>
</html>
