<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>iCIMS Test Fixture</title>
</head>
<body>
  <div class="iCIMS_JobContent">
    <form id="icims-form">
      <div class="form-group">
        <label for="rcm-first-name">Candidate First Name</label>
        <input type="text" id="rcm-first-name" name="rcm-first-name" required>
      </div>
      <div class="form-group">
        <label for="rcm-last-name">Candidate Last Name</label>
        <input type="text" id="rcm-last-name" name="rcm-last-name" required>
      </div>
      <div class="form-group">
        <label for="rcm-email">Email</label>
        <input type="email" id="rcm-email" name="rcm-email" required>
      </div>
      <div class="form-group">
        <label for="rcm-phone">Phone Number</label>
        <input type="tel" id="rcm-phone" name="rcm-phone">
      </div>
      <div class="form-group">
        <label for="rcm-city">City</label>
        <input type="text" id="rcm-city" name="rcm-city">
      </div>
      <div class="form-group">
        <label for="rcm-resume">Upload CV</label>
        <input type="file" id="rcm-resume" name="rcm-resume">
      </div>
    </form>
  </div>
</body>
</html>
