<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lever Test Fixture</title>
</head>
<body>
  <form class="application-form">
    <label>Full name *
      <input type="text" name="name" required>
    </label>

    <label>Email *
      <input type="email" name="email" required>
    </label>

    <label>Phone *
      <input type="text" name="phone">
    </label>

    <label>Current company
      <input type="text" name="org">
    </label>

    <label>LinkedIn URL
      <input type="text" name="urls[LinkedIn]">
    </label>

    <label>GitHub URL
      <input type="text" name="urls[GitHub]">
    </label>

    <label>Portfolio URL
      <input type="text" name="urls[Portfolio]">
    </label>

    <label>Resume *
      <input type="file" name="resume">
    </label>

    <button type="submit" class="postings-btn">Submit application</button>
  </form>
</body>
</html>
