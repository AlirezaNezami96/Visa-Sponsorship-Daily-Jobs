<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Workday Test Fixture</title>
</head>
<body>
  <div data-automation-id="workdayApplication">
    <div data-automation-id="formField-legalFirstName">
      <label>Legal First Name *</label>
      <input type="text" data-automation-id="legalFirstName" required>
    </div>

    <div data-automation-id="formField-legalLastName">
      <label>Legal Last Name *</label>
      <input type="text" data-automation-id="legalLastName" required>
    </div>

    <div data-automation-id="formField-email">
      <label>Email Address *</label>
      <input type="email" data-automation-id="email" required>
    </div>

    <div data-automation-id="formField-phone">
      <label>Phone Number *</label>
      <input type="tel" data-automation-id="phone">
    </div>

    <div data-automation-id="formField-country">
      <label>Country *</label>
      <select data-automation-id="countryDropdown">
        <option value="">Select country</option>
        <option value="Turkey">Turkey</option>
        <option value="United States">United States</option>
      </select>
    </div>

    <button data-automation-id="bottom-navigation-next-button">Next</button>
  </div>
</body>
</html>
