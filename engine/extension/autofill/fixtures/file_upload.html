<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>File Upload Dropzone Test Fixture</title>
</head>
<body>
  <div class="dropzone-container">
    <label for="resume-input">Upload your Resume / CV</label>
    <div class="dropzone" id="dropzone-area">
      <input type="file" id="resume-input" name="resume" accept=".pdf,.doc,.docx">
      <p>Drag and drop your resume here or click to browse</p>
    </div>
  </div>
</body>
</html>
