# [DISABLED] Legacy LinkedIn Post Generator Workflow
# Superseded by the LinkedIn Repurposing Pipeline (.github/workflows/linkedin-republish.yml)

name: "[DISABLED] Generate LinkedIn Post"

on:
  # Triggers disabled to prevent concurrent uncoordinated post generation
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force run legacy generation (disabled by default)"
        type: boolean
        default: false

# Entire job disabled
jobs:
  generate:
    if: ${{ github.event.inputs.force_run == 'true' }}
    runs-on: ubuntu-latest

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate post & request Telegram approval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python generate_post.py

      - name: Commit state changes
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A state/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: add pending linkedin post draft [skip ci]" && git push)
