# Daily Visa Job Scanner
# Scheduled for 04:30 UTC (08:00 AM Iran Time)
# Also supports manual trigger via workflow_dispatch

name: Daily Job Scan

# All three scanners write state back to main. Serialize them so a manual run
# cannot race a scheduled run and lose deduplication state.
concurrency:
  group: job-discovery-state
  cancel-in-progress: false

on:
  schedule:
    # 4 runs/day at 03:20, 09:20, 15:20, 21:20 UTC (20 min after remote scanner)
    - cron: "20 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no email)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 \
            libasound2t64 libxshmfence1 libxrandr2 libxcursor1 libxi6 \
            libxtst6 libxcomposite1 libxdamage1 libxfixes3
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install headless Chromium
        # The crawler only launches headless Chromium; the headless shell is
        # substantially smaller to download and is restored from cache later.
        run: python -m playwright install --only-shell chromium

      - name: Run AI Job Radar
        env:
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER || 'resend' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || 'onboarding@resend.dev' }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python run.py --dry-run
          else
            python run.py
          fi

      - name: Commit state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json state/classifier_cache.json 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update radar seen_jobs and classifier state [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
