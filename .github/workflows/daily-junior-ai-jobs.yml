# Daily Junior AI & ML Job Scanner (AI-Agentic Job-Board Fetcher)
# Scheduled for 05:15 UTC (08:45 AM Iran Time)
# Supports manual trigger via workflow_dispatch

name: Daily Junior AI Job Scan

concurrency:
  group: job-discovery-state
  cancel-in-progress: false

on:
  # Automated schedule disabled per project configuration (direct email disabled)
  # schedule:
  #   # 4 runs/day at 03:40, 09:40, 15:40, 21:40 UTC (40 min after remote scanner)
  #   - cron: "40 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no email sent)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      countries:
        description: "Optional comma-separated countries (e.g. USA,UK,Canada)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  scan-junior-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 \
            libasound2t64 libxshmfence1 libxrandr2 libxcursor1 libxi6 \
            libxtst6 libxcomposite1 libxdamage1 libxfixes3
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install headless Chromium
        run: python -m playwright install --only-shell chromium

      - name: Run Junior AI Job-Board Scraper
        env:
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER || 'resend' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || 'onboarding@resend.dev' }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.countries }}" ]; then
            EXTRA_ARGS="--countries ${{ github.event.inputs.countries }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python run_junior_ai.py --dry-run $EXTRA_ARGS
          else
            python run_junior_ai.py $EXTRA_ARGS
          fi

      - name: Commit seen_junior_ai_jobs and cache state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_junior_ai_jobs.json state/jobboard_cache.json jobboard_config.json state/company_linkedin_cache.json 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update Junior AI jobboard state and cache [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
