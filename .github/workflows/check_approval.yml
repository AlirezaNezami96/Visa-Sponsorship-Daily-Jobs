# LinkedIn Content Approval & Publishing Workflow
# Triggered instantly via Cloudflare Worker repository_dispatch (types: [telegram_approval])
# Also includes a low-frequency schedule fallback (dead-letter check) and manual trigger

name: Check LinkedIn Approval & Publish

on:
  repository_dispatch:
    types: [telegram_approval]
  schedule:
    - cron: "0 16-21 * * *"
  workflow_dispatch:

concurrency:
  group: content-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Process Telegram approval & publish if approved
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_AUTHORIZED_USER_ID: ${{ secrets.TELEGRAM_AUTHORIZED_USER_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python check_and_publish.py

      - name: Commit pipeline state changes
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A state/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: update linkedin content pipeline state [skip ci]" && git push)
