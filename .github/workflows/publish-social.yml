name: Publish Social Channels
on:
  # schedule:
  #   - cron: '0 */2 * * *'  # Every 2 hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-social
  cancel-in-progress: false

env:
  # Multi-Gate Publishing Kill Switch (Shipped DISABLED by default)
  SOCIAL_PUBLISHING_ENABLED: ${{ secrets.SOCIAL_PUBLISHING_ENABLED || 'false' }}
  PUBLISH_DRY_RUN: ${{ secrets.PUBLISH_DRY_RUN || 'true' }}

  # Database & Infrastructure
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  # Social Platform Secrets
  X_API_KEY: ${{ secrets.X_API_KEY || secrets.TWITTER_API_KEY }}
  X_API_SECRET: ${{ secrets.X_API_SECRET || secrets.TWITTER_API_SECRET }}
  X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN || secrets.TWITTER_ACCESS_TOKEN }}
  X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET || secrets.TWITTER_ACCESS_SECRET }}
  BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
  BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
  MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
  MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
  LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
  LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
  LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
  LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  publish-other-platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publish to Bluesky
        run: python -m job_radar.social.platform_publisher --platform bluesky || true
      - name: Publish to Mastodon
        run: python -m job_radar.social.platform_publisher --platform mastodon || true
      - name: Publish or Review on X/Twitter
        run: python -m job_radar.social.platform_publisher --platform x || true
      - name: Publish or Review on LinkedIn
        run: python -m job_radar.social.platform_publisher --platform linkedin || true
      - name: Publish to Dev.to
        run: python -m job_radar.social.platform_publisher --platform devto || true
      - name: Publish to Telegram
        run: python -m job_radar.social.platform_publisher --platform telegram || true
      - name: Publish to Discord
        run: python -m job_radar.social.platform_publisher --platform discord || true
      - name: Publish to Slack
        run: python -m job_radar.social.platform_publisher --platform slack || true
