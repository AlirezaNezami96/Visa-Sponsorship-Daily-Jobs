# Daily Visa Job Scanner
# Runs every day at 08:00 UTC (adjust cron to your timezone)
# Also supports manual trigger via workflow_dispatch

name: Daily Job Scan

on:
  schedule:
    # Cron: minute hour day-of-month month day-of-week (UTC)
    # 08:00 UTC = 00:00 PST = 09:00 CET = 16:00 SGT
    # Change to your preferred time. Use https://crontab.guru to convert.
    - cron: "30 3 * * *"
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab
    inputs:
      dry_run:
        description: "Dry run (no email)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write  # Needed to commit seen_jobs.json back to repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # GitHub free tier limit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for potential conflict resolution

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \n            libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 \n            libasound2 libxshmfence1 libxrandr2 libxcursor1 libxi6 \n            libxtst6 libxcomposite1 libxdamage1 libxfixes3
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Download seen_jobs state
        run: |
          # Try to restore seen_jobs.json from GitHub Actions cache
          # Falls back to committing it to the repo (see last step)
          if [ -f "seen_jobs.json" ]; then
            echo "seen_jobs.json found in repo"
          else
            echo "No seen_jobs.json — starting fresh"
            echo "{}" > seen_jobs.json
          fi

      - name: Run job scraper
        env:
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER || 'resend' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || 'onboarding@resend.dev' }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python run.py --dry-run
          else
            python run.py
          fi

      - name: Commit seen_jobs state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update seen_jobs state [skip ci]"
          git push 2>/dev/null || echo "Push failed or no changes — this is fine for the first run"

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "scan-log-${{ github.run_number }}"
          path: | 
            seen_jobs.json
          retention-days: 7
